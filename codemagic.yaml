workflows:
  android-build:
    name: Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    scripts:
      - name: Extract Android project
        script: |
          unzip -q CheeseCam-v1.5-cloud-build-CODEMAGIC-FIXED-2.zip

      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/CheeseCam-v1.5-cloud-build/local.properties"

      - name: Force JVM 17
        script: |
          cd "$CM_BUILD_DIR/CheeseCam-v1.5-cloud-build"

          cat > force-jvm17.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }
          }

          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/CheeseCam-v1.5-cloud-build"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --init-script force-jvm17.gradle

    artifacts:
      - CheeseCam-v1.5-cloud-build/app/build/outputs/**/*.apk
