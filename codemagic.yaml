workflows:
  android-build:
    name: Android APK
    max_build_duration: 120
    instance_type: linux
    scripts:
      - name: Extract Android project
        script: |
          unzip -q CheeseCam-v1.5-cloud-build-CODEMAGIC-FIXED-2.zip
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/CheeseCam-v1.5-cloud-build/local.properties"
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/CheeseCam-v1.5-cloud-build"
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - CheeseCam-v1.5-cloud-build/app/build/outputs/**/*.apk
